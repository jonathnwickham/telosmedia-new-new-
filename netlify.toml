[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Local `netlify dev` only — ignored by production builds. Vite is pinned to 8080.
[dev]
  command = "npm run dev"
  targetPort = 8080
  port = 8888

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
